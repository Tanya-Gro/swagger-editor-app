name: AI Review

on:
  workflow_dispatch:
    inputs:
      review-command:
        description: Review mode
        type: choice
        required: true
        default: run
        options:
          - run
          - run-inline
          - run-context
          - run-summary
      pull-request-number:
        description: Pull request number to review
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ inputs.pull-request-number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    # Repository secrets and a write-capable token are unavailable to forked PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run AI Review
        continue-on-error: true
        uses: Nikita-Filonov/ai-review@v0.68.0
        with:
          review-command: ${{ inputs.review-command || 'run' }}
        env:
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.GROQ_API_KEY }}

          VCS__PROVIDER: GITHUB
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number || github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: https://api.github.com
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
